name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

# The steps of dart-lang/setup-dart's publishing workflow, with the libhyphen
# submodule checked out: without it, the dry run reports its empty folder as a
# gitignored file and fails.
jobs:
  publish:
    name: Publish to pub.dev
    environment: pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # This is required for authentication using OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Also creates the OIDC token for pub.dev
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Publish - dry run
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish --force
