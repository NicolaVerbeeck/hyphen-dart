name: hyphen_dart
description: Hyphenates words with libhyphen's TeX patterns and gives libhyphen's results, on the VM and the web. Reads .dic files or compact compiled dictionaries.
version: 2.1.0
homepage: https://github.com/NicolaVerbeeck/hyphen-dart
issue_tracker: https://github.com/NicolaVerbeeck/hyphen-dart/issues
topics: [ hyphenation, typography, text, libhyphen ]

environment:
  sdk: ^3.8.1

dependencies:
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  path: any
  coverage: ^1.16.0
